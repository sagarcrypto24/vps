<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>checkingswap — Swap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0B0E14;
    --surface: #131720;
    --surface-2: #1B212C;
    --text: #EDEFF4;
    --muted: #8A93A6;
    --teal: #2DD4BF;
    --violet: #8B5CF6;
    --gold: #F0B90B;
    --line: rgba(255,255,255,0.09);
  }

  html.light-mode{
    --bg: #F4F6F9;
    --surface: #FFFFFF;
    --surface-2: #EEF1F6;
    --text: #12151C;
    --muted: #5B6472;
    --line: rgba(0,0,0,0.09);
  }
  html.light-mode nav{ background:rgba(244,246,249,0.82); }
  html.light-mode .card{ background:#FFFFFF; box-shadow:0 30px 70px -25px rgba(0,0,0,0.18); }
  html.light-mode .bg-glow{
    background:
      radial-gradient(700px 500px at 18% 8%, rgba(45,212,191,0.10), transparent 60%),
      radial-gradient(650px 450px at 88% 18%, rgba(255,144,23,0.10), transparent 60%),
      radial-gradient(600px 500px at 50% 100%, rgba(237,28,36,0.06), transparent 60%);
  }
  html.light-mode .settings-backdrop{ background:rgba(0,0,0,0.25); }
  html.light-mode .primary-btn:not(.pending){
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.9),
      inset 0 -3px 6px rgba(15,61,51,0.1),
      0 10px 24px -10px rgba(0,0,0,0.25),
      0 0 34px -6px rgba(45,212,191,0.4);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;
    min-height:100svh; overflow-x:hidden; display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- animated background layers ---------- */
  #bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.85; }
  .bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(700px 500px at 18% 8%, rgba(45,212,191,0.12), transparent 60%),
      radial-gradient(650px 450px at 88% 18%, rgba(255,144,23,0.16), transparent 60%),
      radial-gradient(600px 500px at 50% 100%, rgba(237,28,36,0.10), transparent 60%);
  }
  .bg-glow::before, .bg-glow::after{
    content:''; position:absolute; width:420px; height:420px; border-radius:50%; filter:blur(10px);
    animation:bgdrift 16s ease-in-out infinite alternate;
  }
  .bg-glow::before{ top:-10%; right:-8%; background:radial-gradient(circle, rgba(255,144,23,0.16), transparent 65%); }
  .bg-glow::after{ bottom:-14%; left:-10%; background:radial-gradient(circle, rgba(237,28,36,0.13), transparent 65%); animation-delay:-8s; }
  @keyframes bgdrift{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(40px,-30px) scale(1.15); } }

  /* ---------- NAV ---------- */
  nav{ position:sticky; top:0; z-index:100; background:rgba(11,14,20,0.7); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:520px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:'Space Grotesk'; font-weight:700; font-size:18px; }
  .brand .mark{ width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg, var(--teal), var(--violet)); flex-shrink:0; box-shadow:0 0 16px -2px rgba(45,212,191,0.6); }
  appkit-button{ --w3m-font-family:'Inter', sans-serif; }

  /* ---------- MAIN (swap at top, single page) ---------- */
  main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:10px 16px 30px; position:relative; z-index:2; }
  .swap-wrap{ width:100%; max-width:360px; perspective:1200px; }

  .pool-viz{ position:relative; width:100%; max-width:200px; height:60px; margin:0 auto 2px; }
  .pool-orb{
    position:absolute; top:50%; width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:700; font-size:9px;
    box-shadow:0 0 34px -2px currentColor, 0 0 8px 0 currentColor; animation:orbit 4.5s ease-in-out infinite;
  }
  .pool-orb.a{ left:22%; transform:translate(-50%,-50%); background:radial-gradient(circle at 35% 30%, #4EE8D4, var(--teal)); color:var(--teal); animation-delay:0s; }
  .pool-orb.b{ left:78%; transform:translate(-50%,-50%); background:radial-gradient(circle at 35% 30%, #B79CFF, var(--violet)); color:var(--violet); animation-delay:-2.25s; }
  .pool-orb span{ color:#081014; }
  .pool-flow{ position:absolute; top:50%; left:22%; right:22%; height:2px; transform:translateY(-50%); overflow:hidden; border-radius:2px; }
  .pool-flow::before{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, var(--teal), var(--violet), var(--teal)); background-size:200% 100%; animation:flow 3s linear infinite; }
  @keyframes flow{ to{ background-position:-200% 0; } }
  @keyframes orbit{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-58%) scale(1.08); } }

  /* ---------- 3D SWAP CARD ---------- */
  .card-stage{ transform-style:preserve-3d; transition:transform 0.12s ease-out; animation:card-in 0.7s cubic-bezier(.16,.84,.44,1) both; }
  @keyframes card-in{ from{ opacity:0; transform:translateY(24px) scale(0.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .pool-viz{ animation:pool-in 0.8s cubic-bezier(.16,.84,.44,1) both 0.1s; }
  @keyframes pool-in{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }
  .card{
    position:relative; background:#0A0A0A; backdrop-filter:none;
    border-radius:20px; padding:20px 20px 52px; isolation:isolate;
    box-shadow:0 30px 70px -25px rgba(0,0,0,0.7);
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:20px; padding:1.5px;
    background:conic-gradient(from var(--ang,0deg), transparent 0 65%, var(--teal) 78%, #FF9017 88%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; animation:chase 5s linear infinite; z-index:-1;
  }
  @keyframes chase{ to{ --ang:360deg; } }
  @property --ang{ syntax:'<angle>'; inherits:false; initial-value:0deg; }

  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; transform:translateZ(24px); }
  .card-head h2{ font-size:18px; font-weight:700; }
  .settings-icon{ width:34px; height:34px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:color 0.2s, background 0.2s, transform 0.3s; position:relative; }
  .settings-icon:hover{ color:var(--teal); background:var(--surface); }
  .settings-icon.open{ color:var(--teal); background:var(--surface); transform:rotate(45deg); }
  .settings-icon svg{ width:17px; height:17px; transition:transform 0.3s; }
  .settings-icon.open svg{ transform:rotate(-45deg); }

  .settings-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); z-index:998;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .settings-backdrop.show{ opacity:1; pointer-events:auto; }

  .settings-panel{
    position:fixed; top:36%; left:50%; width:min(300px, 88vw); background:#FFFFFF; border:1px solid rgba(0,0,0,0.08);
    border-radius:16px; padding:20px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.5); z-index:999;
    opacity:0; transform:translate(-50%,-50%) scale(0.94); pointer-events:none; transition:opacity 0.22s ease, transform 0.22s ease;
  }
  .settings-panel.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .settings-panel .sp-title{ font-family:'Space Grotesk'; font-size:17px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; color:#12151C; }
  .settings-panel .sp-close{ width:26px; height:26px; border-radius:7px; background:#F0F2F5; display:flex; align-items:center; justify-content:center; color:#5B6472; cursor:pointer; }
  .settings-panel .sp-close:hover{ color:#12151C; }
  .settings-panel .sp-label{ font-size:11px; color:#8A93A6; font-family:'JetBrains Mono'; margin-bottom:9px; letter-spacing:0.03em; }
  .sp-options{ display:flex; gap:7px; margin-bottom:12px; }
  .sp-opt{
    flex:1; background:#F0F2F5; border:1px solid transparent; color:#5B6472; font-family:'JetBrains Mono';
    font-size:13px; font-weight:600; padding:9px 0; border-radius:8px; transition:all 0.2s; text-align:center; cursor:pointer;
  }
  .sp-opt.active{ background:rgba(45,212,191,0.14); border-color:var(--teal); color:#0d9488; }
  .sp-opt:hover{ color:#12151C; }
  .sp-custom{ display:flex; align-items:center; gap:8px; background:#F0F2F5; border:1px solid rgba(0,0,0,0.08); border-radius:8px; padding:9px 12px; }
  .sp-custom input{ color:#12151C; }
  .sp-custom input::placeholder{ color:#9AA3B0; }
  .sp-custom span{ color:#5B6472; }

  .sp-row{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; padding-top:16px; border-top:1px solid rgba(0,0,0,0.08); }
  .sp-row-label{ font-size:13px; font-weight:700; color:#12151C; }

  /* ---------- TOKEN PICKER MODAL ---------- */
  .token-modal{
    position:fixed; top:40%; left:50%; width:min(340px, 90vw); max-height:56vh; background:#FFFFFF;
    border:1px solid rgba(0,0,0,0.08); border-radius:16px; padding:16px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.5);
    z-index:999; opacity:0; transform:translate(-50%,-50%) scale(0.94); pointer-events:none;
    transition:opacity 0.22s ease, transform 0.22s ease; display:flex; flex-direction:column; min-height:0;
  }
  .token-modal.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .token-modal .tm-title{ font-family:'Space Grotesk'; font-size:17px; font-weight:700; color:#12151C; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .token-modal .tm-close{ width:26px; height:26px; border-radius:7px; background:#F0F2F5; display:flex; align-items:center; justify-content:center; color:#5B6472; cursor:pointer; }
  .token-modal .tm-close:hover{ color:#12151C; }
  .tm-search{
    background:#F0F2F5; border:1px solid rgba(0,0,0,0.08); border-radius:10px; padding:10px 12px; margin-bottom:12px;
    font-family:'Inter'; font-size:14px; color:#12151C; outline:none; flex-shrink:0;
  }
  .tm-search::placeholder{ color:#9AA3B0; }
  .tm-list{ overflow-y:auto; display:flex; flex-direction:column; gap:4px; flex:1; min-height:0; }
  .tm-item{
    display:flex; align-items:center; gap:11px; padding:8px 8px; border-radius:10px; cursor:pointer;
    transition:background 0.15s ease; border:none; background:transparent; width:100%; text-align:left;
  }
  .tm-item:hover{ background:#F0F2F5; }
  .tm-item.selected{ background:rgba(45,212,191,0.1); }
  .tm-item .tm-dot{
    width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12px; color:#fff; overflow:hidden;
  }
  .tm-item .tm-dot img, .tm-item .tm-dot svg{ width:100%; height:100%; object-fit:cover; }
  .tm-item .tm-info{ display:flex; flex-direction:column; }
  .tm-item .tm-symbol{ font-weight:700; font-size:14px; color:#12151C; }
  .tm-item .tm-name{ font-size:11.5px; color:#8A93A6; }
  .tm-item .tm-pin{
    margin-left:auto; font-family:'JetBrains Mono'; font-size:9.5px; font-weight:700; color:#0d9488;
    background:rgba(45,212,191,0.14); padding:2px 7px; border-radius:999px; flex-shrink:0;
  }

  .theme-toggle{
    position:relative; width:60px; height:30px; border-radius:999px; background:#F0F2F5;
    border:1px solid rgba(0,0,0,0.08); cursor:pointer; flex-shrink:0; padding:2px;
  }
  .theme-toggle .tt-icon{
    position:absolute; top:0; bottom:0; width:26px; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .theme-toggle .tt-icon.sun{ left:2px; color:#F5A623; }
  .theme-toggle .tt-icon.moon{ right:2px; color:var(--muted); }
  .theme-toggle .tt-icon svg{ width:14px; height:14px; }
  .theme-toggle .tt-thumb{
    position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.35);
    transition:transform 0.3s cubic-bezier(.2,.9,.3,1.2);
    display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle .tt-thumb svg{ width:14px; height:14px; }
  .theme-toggle.is-dark .tt-thumb{ transform:translateX(30px); color:var(--muted); }
  .theme-toggle:not(.is-dark) .tt-thumb{ color:#F5A623; }
  .sp-custom input{ background:transparent; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono'; font-size:13px; width:100%; }
  .sp-custom span{ color:var(--muted); font-family:'JetBrains Mono'; font-size:13px; }

  .token-box{ background:var(--surface-2); border:1px solid transparent; border-radius:14px; padding:24px 15px; transition:border-color 0.2s, box-shadow 0.2s; transform:translateZ(20px); }
  .token-box:focus-within{ border-color:rgba(45,212,191,0.45); box-shadow:0 0 0 3px rgba(45,212,191,0.1); }
  .token-box .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .token-box .row1 span{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono'; }
  .token-box .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .amount-input{ background:transparent; border:none; color:var(--text); font-family:'JetBrains Mono'; font-size:23px; font-weight:500; width:100%; outline:none; }
  .amount-input::placeholder{ color:#454C5C; }
  .token-select{
    display:flex; align-items:center; gap:7px; background:var(--bg); border:1px solid var(--line); border-radius:999px;
    padding:6px 10px 6px 6px; font-weight:600; font-size:14px; white-space:nowrap; flex-shrink:0;
    color:var(--text); font-family:'Inter'; cursor:pointer; transition:border-color 0.2s, background 0.2s;
  }
  .token-select:hover{ border-color:var(--teal); background:var(--surface-2); }
  .token-select .chev{ width:14px; height:14px; margin-left:1px; color:var(--muted); flex-shrink:0; }
  .all-btn{
    flex-shrink:0; background:rgba(45,212,191,0.12); border:1px solid rgba(45,212,191,0.35); color:var(--teal);
    font-family:'JetBrains Mono'; font-size:10.5px; font-weight:700; letter-spacing:0.04em; padding:5px 9px;
    border-radius:999px; cursor:pointer; transition:all 0.2s ease;
  }
  .all-btn:hover{ background:rgba(45,212,191,0.22); transform:translateY(-1px); }
  .all-btn:active{ transform:translateY(0) scale(0.96); }
  .token-select .dot{ width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#1a1a1a; }
  .token-select .dot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .token-select .dot svg{ width:100%; height:100%; display:block; }

  .swap-divider{ display:flex; justify-content:center; margin:-10px 0; position:relative; z-index:3; transform:translateZ(28px); }
  .swap-flip{
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg, var(--teal), var(--violet));
    border:4px solid var(--bg);
    box-shadow:0 0 0 1px var(--line), 0 8px 20px -6px rgba(45,212,191,0.4);
    display:flex; align-items:center; justify-content:center; color:#08110F;
    cursor:pointer; transition:box-shadow 0.25s ease, transform 0.2s ease;
  }
  .swap-flip svg{ width:19px; height:19px; transition:transform 0.5s cubic-bezier(.34,1.56,.64,1); }
  .swap-flip:hover{ box-shadow:0 0 0 1px var(--line), 0 0 26px -2px rgba(139,92,246,0.6); transform:scale(1.06); }
  .swap-flip:hover svg{ transform:rotate(180deg); }
  .swap-flip:active svg{ transform:rotate(180deg) scale(0.85); }
  .swap-flip.spin svg{ animation:flip-spin 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes flip-spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .swap-flip:hover{ transform:rotate(180deg); }

  .rate-line{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin:14px 0; font-family:'JetBrains Mono'; transform:translateZ(18px); }
  .rate-line b{ color:var(--text); font-weight:500; }

  .primary-btn{
    position:relative; width:100%; padding:6px; border-radius:999px; font-weight:800; font-size:15px;
    background:linear-gradient(180deg, #F4FBF9 0%, #DCEFEA 55%, #CCE6DE 100%);
    color:#0F3D33; overflow:hidden; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; min-height:58px;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.9),
      inset 0 -3px 6px rgba(15,61,51,0.12),
      0 10px 24px -10px rgba(0,0,0,0.5),
      0 0 34px -6px rgba(45,212,191,0.55);
    transform:translateZ(24px) translateY(0);
    transition:box-shadow 0.15s ease, transform 0.15s ease;
    animation:btn-breathe 2.8s ease-in-out infinite;
  }
  @keyframes btn-breathe{
    0%,100%{ transform:translateZ(24px) translateY(0) scale(1);
      box-shadow:inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(15,61,51,0.12), 0 10px 24px -10px rgba(0,0,0,0.5), 0 0 34px -6px rgba(45,212,191,0.55); }
    50%{ transform:translateZ(24px) translateY(-2px) scale(1.012);
      box-shadow:inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(15,61,51,0.12), 0 14px 30px -10px rgba(0,0,0,0.5), 0 0 50px -4px rgba(45,212,191,0.75); }
  }
  .primary-btn.sliding, .primary-btn.slide-complete{ animation:none; }

  .btn-fill{
    position:absolute; top:0; left:0; bottom:0; width:0px; border-radius:999px;
    background:linear-gradient(90deg, #1a8f80, var(--teal) 70%, #7CFFD8);
    z-index:1; pointer-events:none;
  }
  .primary-btn.sliding .btn-fill{ transition:none; }
  .primary-btn:not(.sliding) .btn-fill{ transition:width 0.3s cubic-bezier(.2,.9,.3,1.2); }
  .primary-btn.slide-complete .btn-fill{ background:linear-gradient(90deg, #0d9488, var(--teal) 60%, #C8FFF0); }
  .primary-btn.pending .btn-fill{ display:none; }

  .btn-track-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:2; }
  .primary-btn .btn-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:0.01em; transition:opacity 0.15s ease; }
  .primary-btn:not(.pending) .btn-track-label{ padding-left:36px; }
  .primary-btn.slide-complete .btn-label{ opacity:0.35; }

  .primary-btn .btn-dot{
    display:none; position:relative; z-index:2; flex-shrink:0; width:46px; height:46px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7CFFD8, var(--teal) 65%, #0d9488 100%);
    box-shadow:0 0 0 5px rgba(45,212,191,0.14), 0 0 18px 2px rgba(45,212,191,0.85);
    align-items:center; justify-content:center; cursor:grab; touch-action:none;
    animation:dot-pulse 1.8s ease-in-out infinite;
  }
  .primary-btn:not(.pending) .btn-dot{ display:flex; }
  .primary-btn.sliding .btn-dot{ cursor:grabbing; animation:none; }
  .primary-btn .btn-dot svg{ width:20px; height:20px; }
  @keyframes dot-pulse{ 0%,100%{ box-shadow:0 0 0 5px rgba(45,212,191,0.14), 0 0 18px 2px rgba(45,212,191,0.85); } 50%{ box-shadow:0 0 0 8px rgba(45,212,191,0.08), 0 0 26px 4px rgba(45,212,191,1); } }
  .primary-btn.slide-complete .btn-dot{
    background:radial-gradient(circle at 35% 30%, #C8FFF0, #34E8B8 65%, #0d9488 100%);
    box-shadow:0 0 0 6px rgba(45,212,191,0.22), 0 0 28px 4px rgba(45,212,191,1);
  }

  .primary-btn.pending{
    justify-content:center; color:#fff; padding:17px 22px; gap:12px;
    background:linear-gradient(180deg, #2FE0D6 0%, #1EC9BE 55%, #16B0A6 100%);
    box-shadow:0 4px 0 0 #0E8880, 0 10px 22px -8px rgba(30,201,190,0.55);
    animation:btn-breathe-teal 2.8s ease-in-out infinite; cursor:pointer;
  }
  .primary-btn.pending .btn-track-label{ position:static; }
  @keyframes btn-breathe-teal{
    0%,100%{ transform:translateZ(24px) translateY(0) scale(1); }
    50%{ transform:translateZ(24px) translateY(-2px) scale(1.012); }
  }

  function updateSwapButtonLabel(){
    if(!walletAddress){
      document.getElementById('swapBtnLabel').textContent = 'Connect Wallet to Swap';
      swapBtn.classList.add('pending');
    } else if(!amountInEl.value || Number(amountInEl.value) <= 0){
      document.getElementById('swapBtnLabel').textContent = 'Enter an amount';
      swapBtn.classList.add('pending');
    } else {
      document.getElementById('swapBtnLabel').textContent = 'Slide to Swap ' + fromToken.symbol + ' → ' + toToken.symbol;
      swapBtn.classList.remove('pending');
    }
  }

  function currentPair(){
    return { inAddr: fromToken.address, outAddr: toToken.address, inSym: fromToken.symbol, outSym: toToken.symbol };
  }

  let lastFromBalanceExact = '0';

  async function refreshBalances(){
    if(!signer || !walletAddress || !ethersLib) return;
    try{
      const { inAddr, outAddr } = currentPair();
      const tokenIn = new ethersLib.Contract(inAddr, ERC20_ABI, ethersProvider);
      const tokenOut = new ethersLib.Contract(outAddr, ERC20_ABI, ethersProvider);
      const [decIn, decOut, balIn, balOut] = await Promise.all([
        tokenIn.decimals(), tokenOut.decimals(),
        tokenIn.balanceOf(walletAddress), tokenOut.balanceOf(walletAddress)
      ]);
      lastFromBalanceExact = ethersLib.formatUnits(balIn, decIn);
      balanceFromEl.textContent = 'Balance: ' + Number(lastFromBalanceExact).toFixed(4);
      balanceToEl.textContent = 'Balance: ' + Number(ethersLib.formatUnits(balOut, decOut)).toFixed(4);
    }catch(err){ console.error('Balance fetch error:', err); }
  }

  const allBtn = document.getElementById('allBtn');
  allBtn.addEventListener('click', async () => {
    if(!walletAddress){
      if(appKitModal) appKitModal.open();
      return;
    }
    await refreshBalances(); // latest balance le aao before filling
    amountInEl.value = lastFromBalanceExact;
    updateQuote();
    updateSwapButtonLabel();
  });

  async function updateQuote(){
    const { inAddr, outAddr, inSym, outSym } = currentPair();
    if(!amountInEl.value || Number(amountInEl.value) <= 0){
      amountOutEl.value = '';
      rateValEl.textContent = '1 ' + inSym + ' = — ' + outSym;
      updateSwapButtonLabel();
      return;
    }
    if(!ethersProvider || !ethersLib){ updateSwapButtonLabel(); return; }
    try{
      const tokenIn = new ethersLib.Contract(inAddr, ERC20_ABI, ethersProvider);
      const decIn = await tokenIn.decimals();
      const amountInWei = ethersLib.parseUnits(amountInEl.value, decIn);

      const zirakSwap = new ethersLib.Contract(ZIRAKSWAP_ADDRESS, ZIRAKSWAP_ABI, ethersProvider);
      const outWei = await zirakSwap.quoteDirect(amountInWei, inAddr, outAddr);

      const tokenOut = new ethersLib.Contract(outAddr, ERC20_ABI, ethersProvider);
      const decOut = await tokenOut.decimals();
      const outFormatted = ethersLib.formatUnits(outWei, decOut);

      amountOutEl.value = Number(outFormatted).toFixed(6);
      const rate = Number(outFormatted) / Number(amountInEl.value);
      rateValEl.textContent = '1 ' + inSym + ' = ' + rate.toFixed(4) + ' ' + outSym;
    }catch(err){
      console.error('Quote error:', err);
      rateValEl.textContent = '1 ' + inSym + ' = — ' + outSym;
    }
    updateSwapButtonLabel();
  }

  amountInEl.addEventListener('input', () => {
    clearTimeout(quoteDebounce);
    quoteDebounce = setTimeout(updateQuote, 400);
    updateSwapButtonLabel();
  });

  function renderTokenSelect(side){
    const token = side === 'from' ? fromToken : toToken;
    const selectEl = document.getElementById(side === 'from' ? 'fromTokenSelect' : 'toTokenSelect');
    const iconEl = document.getElementById(side === 'from' ? 'fromTokenIcon' : 'toTokenIcon');
    const symEl = document.getElementById(side === 'from' ? 'fromTokenSymbol' : 'toTokenSymbol');
    iconEl.style.background = token.bg || 'var(--surface-2)';
    iconEl.innerHTML = tokenDotHTML(token);
    symEl.textContent = token.symbol; // textContent = safe by default, no HTML injection risk

    const chevron = selectEl.querySelector('.chev');
    const isLocked = token.symbol === 'USDT';
    if(chevron) chevron.style.display = isLocked ? 'none' : '';
    selectEl.style.cursor = isLocked ? 'default' : 'pointer';
    selectEl.style.opacity = isLocked ? '1' : '1';
  }
  renderTokenSelect('from');
  renderTokenSelect('to');

  flipBtn.addEventListener('click', () => {
    flipBtn.classList.remove('spin');
    void flipBtn.offsetWidth; // restart animation
    flipBtn.classList.add('spin');
    const tmp = fromToken;
    fromToken = toToken;
    toToken = tmp;
    renderTokenSelect('from');
    renderTokenSelect('to');
    amountInEl.value = '';
    amountOutEl.value = '';
    updateQuote();
    refreshBalances();
  });

  /* ---- token picker modal ---- */
  const tokenModal = document.getElementById('tokenModal');
  const tokenModalBackdrop = document.getElementById('tokenModalBackdrop');
  const tokenModalClose = document.getElementById('tokenModalClose');
  const tokenSearch = document.getElementById('tokenSearch');
  const tokenList = document.getElementById('tokenList');

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Agar image load fail ho jaaye (logo maujood nahi), letter-badge fallback dikhate hain
  window.__tokenIconFallback = function(imgEl, symbol){
    var span = document.createElement('span');
    span.style.cssText = "font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;font-weight:800;";
    span.textContent = (symbol || '?').slice(0,4).toUpperCase();
    imgEl.replaceWith(span);
  };

  function tokenDotHTML(t){
    const safeSymbol = escapeHtml(t.symbol);
    if(t.img){
      return '<img src="' + t.img + '" alt="' + safeSymbol + '" style="width:100%;height:100%;object-fit:cover;" ' +
        'onerror=\'window.__tokenIconFallback(this, "' + safeSymbol.replace(/"/g,'') + '")\'>';
    }
    return t.icon || '';
  }

  let customTokenLookupSeq = 0;

  async function renderTokenList(filter){
    const q = (filter || '').trim().toLowerCase();
    const otherToken = pickerSide === 'from' ? toToken : fromToken;
    const otherIsUsdt = otherToken.symbol === 'USDT';

    // USDT hamesha sabse upar (priority) — baaki alphabetically
    let sorted = [...TOKEN_LIST].sort((a,b) => {
      if(a.pinned) return -1;
      if(b.pinned) return 1;
      return a.symbol.localeCompare(b.symbol);
    });

    // ★ Zaroori niyam: agar doosri taraf USDT nahi hai, to is side par SIRF USDT hi chuna ja sakta hai —
    // isse hamesha ek side USDT bani rehti hai, kabhi bhi "SHIB <-> WBNB" jaisa non-USDT pair nahi ban sakta
    if(!otherIsUsdt){
      sorted = sorted.filter(t => t.symbol === 'USDT');
    }

    const filtered = sorted.filter(t =>
      !q || t.symbol.toLowerCase().includes(q) || t.name.toLowerCase().includes(q) || t.address.toLowerCase() === q
    );

    const isAddressQuery = /^0x[a-fA-F0-9]{40}$/.test(q);
    const alreadyInList = filtered.some(t => t.address.toLowerCase() === q);

    tokenList.innerHTML = '';

    if(!otherIsUsdt && !q){
      const noteEl = document.createElement('div');
      noteEl.className = 'tm-item';
      noteEl.style.opacity = '0.6'; noteEl.style.cursor = 'default';
      noteEl.innerHTML = '<span class="tm-info"><span class="tm-name">Ek side hamesha USDT rehti hai — pehle isse USDT chunein</span></span>';
      tokenList.appendChild(noteEl);
    }

    // Agar user ne ek valid address paste ki hai jo list mein nahi hai, blockchain se uski info laate hain
    if(isAddressQuery && !alreadyInList && otherIsUsdt){
      const mySeq = ++customTokenLookupSeq;
      const loadingBtn = document.createElement('div');
      loadingBtn.className = 'tm-item';
      loadingBtn.style.opacity = '0.6';
      loadingBtn.innerHTML = '<span class="tm-info"><span class="tm-symbol">Looking up token...</span><span class="tm-name">' + q + '</span></span>';
      tokenList.appendChild(loadingBtn);

      if(!ethersProvider || !ethersLib){
        loadingBtn.innerHTML = '<span class="tm-info"><span class="tm-symbol">Connect wallet first</span><span class="tm-name">Token lookup needs a wallet connection</span></span>';
      } else {
        try{
          const tokenContract = new ethersLib.Contract(q, ERC20_ABI, ethersProvider);
          const [tName, tSymbol, tDecimals] = await Promise.all([
            tokenContract.name(), tokenContract.symbol(), tokenContract.decimals()
          ]);
          if(mySeq !== customTokenLookupSeq) return; // ek naya search shuru ho chuka hai, purana result ignore karo

          // ⚠️ tName/tSymbol seedhe kisi bhi arbitrary contract se aate hain — HTML mein daalne se pehle
          // hamesha escape karo, warna ek malicious token contract page mein code inject kar sakta hai
          const checksummed = ethersLib.getAddress(q);
          const logoUrl = 'https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/smartchain/assets/' + checksummed + '/logo.png';

          const customToken = { symbol: tSymbol, name: tName, address: q, custom: true,
            img: logoUrl, bg: '#5B6472' };

          const selectedToken = pickerSide === 'from' ? fromToken : toToken;
          const otherToken = pickerSide === 'from' ? toToken : fromToken;
          const isDisabled = customToken.address.toLowerCase() === otherToken.address.toLowerCase();

          const safeSymbol = escapeHtml(customToken.symbol);
          const safeName = escapeHtml(customToken.name);

          const btn = document.createElement('button');
          btn.className = 'tm-item';
          btn.style.opacity = isDisabled ? '0.4' : '1';
          btn.style.cursor = isDisabled ? 'not-allowed' : 'pointer';
          btn.innerHTML =
            '<span class="tm-dot" style="background:' + customToken.bg + '">' + tokenDotHTML(customToken) + '</span>' +
            '<span class="tm-info"><span class="tm-symbol">' + safeSymbol + '</span><span class="tm-name">' + safeName + ' · Custom token, verify carefully</span></span>';
          if(!isDisabled){
            btn.addEventListener('click', () => {
              if(pickerSide === 'from') fromToken = customToken; else toToken = customToken;
              renderTokenSelect(pickerSide);
              closeTokenModal();
              amountInEl.value = '';
              amountOutEl.value = '';
              updateQuote();
              refreshBalances();
            });
          }
          tokenList.innerHTML = '';
          tokenList.appendChild(btn);
        }catch(err){
          console.error('Custom token lookup failed:', err);
          if(mySeq !== customTokenLookupSeq) return;
          loadingBtn.innerHTML = '<span class="tm-info"><span class="tm-symbol">Not a valid BEP-20 token</span><span class="tm-name">Could not read this contract</span></span>';
        }
      }
      return;
    }

    filtered.forEach(t => {
      const selectedToken = pickerSide === 'from' ? fromToken : toToken;
      const otherToken = pickerSide === 'from' ? toToken : fromToken;
      const isSelected = t.address === selectedToken.address;
      const isDisabled = t.address === otherToken.address;
      const btn = document.createElement('button');
      btn.className = 'tm-item' + (isSelected ? ' selected' : '');
      btn.style.opacity = isDisabled ? '0.4' : '1';
      btn.style.cursor = isDisabled ? 'not-allowed' : 'pointer';
      btn.innerHTML =
        '<span class="tm-dot" style="background:' + (t.bg || '#ccc') + '">' + tokenDotHTML(t) + '</span>' +
        '<span class="tm-info"><span class="tm-symbol">' + t.symbol + '</span><span class="tm-name">' + t.name + '</span></span>' +
        (t.pinned ? '<span class="tm-pin">TOP</span>' : '');
      if(!isDisabled){
        btn.addEventListener('click', () => {
          if(pickerSide === 'from') fromToken = t; else toToken = t;
          renderTokenSelect(pickerSide);
          closeTokenModal();
          amountInEl.value = '';
          amountOutEl.value = '';
          updateQuote();
          refreshBalances();
        });
      }
      tokenList.appendChild(btn);
    });
  }

  function openTokenModal(side){
    pickerSide = side;
    tokenSearch.value = '';
    renderTokenList('');
    tokenModal.classList.add('show');
    tokenModalBackdrop.classList.add('show');
  }
  function closeTokenModal(){
    tokenModal.classList.remove('show');
    tokenModalBackdrop.classList.remove('show');
  }

  document.getElementById('fromTokenSelect').addEventListener('click', () => {
    if(fromToken.symbol === 'USDT') return; // USDT wali side fixed hai — click par kuch na ho
    openTokenModal('from');
  });
  document.getElementById('toTokenSelect').addEventListener('click', () => {
    if(toToken.symbol === 'USDT') return; // USDT wali side fixed hai — click par kuch na ho
    openTokenModal('to');
  });
  tokenModalClose.addEventListener('click', closeTokenModal);
  tokenModalBackdrop.addEventListener('click', closeTokenModal);
  let tokenSearchDebounce = null;
  tokenSearch.addEventListener('input', () => {
    clearTimeout(tokenSearchDebounce);
    tokenSearchDebounce = setTimeout(() => renderTokenList(tokenSearch.value), 350);
  });

  document.querySelectorAll('.sp-opt').forEach(opt => {
    opt.addEventListener('click', () => { slippagePercent = parseFloat(opt.dataset.val); });
  });
  customSlippageEl.addEventListener('input', () => {
    const val = parseFloat(customSlippageEl.value);
    if(!isNaN(val) && val > 0 && val <= 50) slippagePercent = val;
  });

  /* ===== Real swap — calls the deployed ZirakSwap contract ===== */
  async function performSwap(){
    const { inAddr, outAddr, inSym, outSym } = currentPair();
    const originalLabel = document.getElementById('swapBtnLabel').textContent;

    try{
      const tokenIn = new ethersLib.Contract(inAddr, ERC20_ABI, signer);
      const decIn = await tokenIn.decimals();
      const amountInWei = ethersLib.parseUnits(amountInEl.value, decIn);

      const zirakSwapRead = new ethersLib.Contract(ZIRAKSWAP_ADDRESS, ZIRAKSWAP_ABI, ethersProvider);
      const quotedOut = await zirakSwapRead.quoteDirect(amountInWei, inAddr, outAddr);

      // slippage tolerance apply karte hain (jaise 0.5% => 99.5% guaranteed minimum)
      const slippageBps = BigInt(Math.round(slippagePercent * 100)); // basis points
      const minOut = quotedOut - (quotedOut * slippageBps / 10000n);

      // 1) Allowance check karo, agar kam hai to approve karo (ZirakSwap contract ko)
      const allowance = await tokenIn.allowance(walletAddress, ZIRAKSWAP_ADDRESS);
      if(allowance < amountInWei){
        document.getElementById('swapBtnLabel').textContent = 'Approving ' + inSym + '...';
        const approveTx = await tokenIn.approve(ZIRAKSWAP_ADDRESS, amountInWei);
        await approveTx.wait();
      }

      // 2) Asli swap — ZirakSwap contract PancakeSwap ke through route karta hai, seedha user ke wallet me
      document.getElementById('swapBtnLabel').textContent = 'Swapping...';
      const zirakSwapWrite = new ethersLib.Contract(ZIRAKSWAP_ADDRESS, ZIRAKSWAP_ABI, signer);
      const deadline = Math.floor(Date.now() / 1000) + 60 * 20; // 20 minute deadline

      const swapTx = await zirakSwapWrite.swapDirect(inAddr, outAddr, amountInWei, minOut, deadline);

      document.getElementById('swapBtnLabel').textContent = 'Confirming...';
      await swapTx.wait();

      document.getElementById('swapBtnLabel').textContent = '✓ Swap Successful';
      amountInEl.value = '';
      amountOutEl.value = '';
      refreshBalances();
      setTimeout(() => { updateSwapButtonLabel(); resetSlider(); }, 2500);
    }catch(err){
      console.error('Swap error:', err);
      const msg = (err && err.shortMessage) ? err.shortMessage : 'Swap fail ho gaya, dobara try karen.';
      alert(msg);
      document.getElementById('swapBtnLabel').textContent = originalLabel;
      resetSlider();
    }
  }

  /* ---- Slide-to-confirm drag logic (only active when button is in ready/non-pending state) ---- */
  const sliderHandle = document.getElementById('swapBtnHandle');
  const sliderFill = document.getElementById('swapBtnFill');
  let isDragging = false, startX = 0, currentX = 0, maxDrag = 0;

  function setFillWidth(x){
    // handle ke center tak fill kare — handle radius add karte hain taaki fill handle ke peeche se bilkul match kare
    const handleCenter = (sliderHandle.offsetWidth / 2) + 6 + x;
    sliderFill.style.width = handleCenter + 'px';
  }

  function resetSlider(){
    isDragging = false;
    sliderHandle.style.transition = 'transform 0.3s cubic-bezier(.2,.9,.3,1.2)';
    sliderHandle.style.transform = 'translateX(0px)';
    sliderFill.style.width = '0px';
    swapBtn.classList.remove('sliding', 'slide-complete');
  }

  function onDragStart(e){
    if(swapBtn.classList.contains('pending')) return; // pending state = normal click (open wallet)
    isDragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX);
    maxDrag = swapBtn.offsetWidth - sliderHandle.offsetWidth - 8;
    sliderHandle.style.transition = 'none';
    swapBtn.classList.add('sliding');
  }

  function onDragMove(e){
    if(!isDragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    currentX = Math.max(0, Math.min(x - startX, maxDrag));
    sliderHandle.style.transform = 'translateX(' + currentX + 'px)';
    setFillWidth(currentX);
    if(currentX >= maxDrag * 0.85){ swapBtn.classList.add('slide-complete'); }
    else{ swapBtn.classList.remove('slide-complete'); }
  }

  async function onDragEnd(){
    if(!isDragging) return;
    isDragging = false;
    swapBtn.classList.remove('sliding');

    if(currentX >= maxDrag * 0.85){
      // pura slide hua — snap to end aur transaction shuru karo
      sliderHandle.style.transition = 'transform 0.15s ease';
      sliderHandle.style.transform = 'translateX(' + maxDrag + 'px)';
      setFillWidth(maxDrag);

      if(!walletAddress){
        if(appKitModal) appKitModal.open();
        resetSlider();
        return;
      }
      if(!signer || !ethersLib){
        alert('Wallet signer not ready yet, please try again in a few seconds.');
        resetSlider();
        return;
      }
      if(!amountInEl.value || Number(amountInEl.value) <= 0){
        alert('Please enter an amount.');
        resetSlider();
        return;
      }
      await performSwap();
    } else {
      resetSlider();
    }
  }

  sliderHandle.addEventListener('mousedown', onDragStart);
  sliderHandle.addEventListener('touchstart', onDragStart, { passive:true });
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', onDragMove, { passive:true });
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);

  // Pending state (wallet not connected) — simple tap khole modal, slide nahi chahiye
  swapBtn.addEventListener('click', () => {
    if(!swapBtn.classList.contains('pending')) return;
    if(!walletAddress){
      if(appKitModal) appKitModal.open();
      else alert('Wallet connect module is still loading, please try again in a few seconds.');
    }
  });

  /* ---- 3D tilt on swap card (desktop only) ---- */
  var stage = document.getElementById('tiltStage');
  if(stage && !reduced && !isMobile){
    stage.addEventListener('mousemove', function(e){
      var r = stage.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      stage.style.transform = 'rotateY(' + (x*10) + 'deg) rotateX(' + (-y*10) + 'deg)';
    });
    stage.addEventListener('mouseleave', function(){ stage.style.transform = 'rotateY(0deg) rotateX(0deg)'; });
  }

  /* ---- floating particle background (skip on mobile for performance) ---- */
  var canvas = document.getElementById('bg-canvas');
  if(canvas && window.THREE && !reduced && !isMobile){
    var w = window.innerWidth, h = window.innerHeight;
    var renderer = new THREE.WebGLRenderer({ canvas:canvas, alpha:true, antialias:true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
    camera.position.set(0, 0, 14);

    var group = new THREE.Group();
    scene.add(group);

    var geo = new THREE.BufferGeometry();
    var count = 90;
    var positions = new Float32Array(count*3);
    for(var i=0;i<count;i++){
      positions[i*3] = (Math.random()-0.5)*22;
      positions[i*3+1] = (Math.random()-0.5)*14;
      positions[i*3+2] = (Math.random()-0.5)*10 - 4;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var mat = new THREE.PointsMaterial({ color:0x2DD4BF, size:0.045, transparent:true, opacity:0.55 });
    var points = new THREE.Points(geo, mat);
    group.add(points);

    var mat2 = new THREE.PointsMaterial({ color:0xFF9017, size:0.04, transparent:true, opacity:0.5 });
    var points2 = new THREE.Points(geo.clone(), mat2);
    points2.rotation.z = 0.6;
    group.add(points2);

    var mouseX=0, mouseY=0;
    window.addEventListener('mousemove', function(e){
      mouseX = (e.clientX/window.innerWidth)-0.5;
      mouseY = (e.clientY/window.innerHeight)-0.5;
    });

    function animate(){
      requestAnimationFrame(animate);
      group.rotation.y += 0.0006;
      group.rotation.x += (-mouseY*0.15 - group.rotation.x)*0.02;
      group.rotation.y += (mouseX*0.1 - group.rotation.y)*0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function(){
      var nw = window.innerWidth, nh = window.innerHeight;
      camera.aspect = nw/nh; camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    });
  }
})();
</script>
