<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZirakSwap — Swap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0B0E14;
    --surface: #131720;
    --surface-2: #1B212C;
    --text: #EDEFF4;
    --muted: #8A93A6;
    --teal: #2DD4BF;
    --violet: #8B5CF6;
    --gold: #F0B90B;
    --line: rgba(255,255,255,0.09);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;
    min-height:100svh; overflow-x:hidden; display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; border:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- animated background layers ---------- */
  #bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.85; }
  .bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(700px 500px at 18% 8%, rgba(45,212,191,0.14), transparent 60%),
      radial-gradient(650px 450px at 88% 18%, rgba(139,92,246,0.14), transparent 60%),
      radial-gradient(600px 500px at 50% 100%, rgba(240,185,11,0.06), transparent 60%);
  }

  /* ---------- NAV ---------- */
  nav{ position:sticky; top:0; z-index:100; background:rgba(11,14,20,0.7); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:520px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:'Space Grotesk'; font-weight:700; font-size:18px; }
  .brand .mark{ width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg, var(--teal), var(--violet)); flex-shrink:0; box-shadow:0 0 16px -2px rgba(45,212,191,0.6); }
  appkit-button{ --w3m-font-family:'Inter', sans-serif; }

  /* ---------- MAIN (swap at top, single page) ---------- */
  main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:26px 16px 40px; position:relative; z-index:2; }
  .swap-wrap{ width:100%; max-width:420px; perspective:1200px; }

  .pool-viz{ position:relative; width:100%; max-width:220px; height:70px; margin:0 auto 16px; }
  .pool-orb{
    position:absolute; top:50%; width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:700; font-size:9px;
    box-shadow:0 0 30px -4px currentColor; animation:orbit 4.5s ease-in-out infinite;
  }
  .pool-orb.a{ left:22%; transform:translate(-50%,-50%); background:radial-gradient(circle at 35% 30%, #4EE8D4, var(--teal)); color:var(--teal); animation-delay:0s; }
  .pool-orb.b{ left:78%; transform:translate(-50%,-50%); background:radial-gradient(circle at 35% 30%, #B79CFF, var(--violet)); color:var(--violet); animation-delay:-2.25s; }
  .pool-orb span{ color:#081014; }
  .pool-flow{ position:absolute; top:50%; left:22%; right:22%; height:2px; transform:translateY(-50%); overflow:hidden; border-radius:2px; }
  .pool-flow::before{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, var(--teal), var(--violet), var(--teal)); background-size:200% 100%; animation:flow 3s linear infinite; }
  @keyframes flow{ to{ background-position:-200% 0; } }
  @keyframes orbit{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-58%) scale(1.08); } }

  /* ---------- 3D SWAP CARD ---------- */
  .card-stage{ transform-style:preserve-3d; transition:transform 0.12s ease-out; }
  .card{
    position:relative; background:rgba(19,23,32,0.75); backdrop-filter:blur(18px);
    border-radius:20px; padding:20px; isolation:isolate;
    box-shadow:0 30px 70px -25px rgba(0,0,0,0.7);
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:20px; padding:1.5px;
    background:conic-gradient(from var(--ang,0deg), transparent 0 70%, var(--teal) 82%, var(--violet) 92%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; animation:chase 5s linear infinite; z-index:-1;
  }
  @keyframes chase{ to{ --ang:360deg; } }
  @property --ang{ syntax:'<angle>'; inherits:false; initial-value:0deg; }

  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; transform:translateZ(24px); }
  .card-head h2{ font-size:18px; font-weight:700; }
  .settings-icon{ width:32px; height:32px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }

  .token-box{ background:var(--surface-2); border:1px solid transparent; border-radius:14px; padding:15px; transition:border-color 0.2s, box-shadow 0.2s; transform:translateZ(20px); }
  .token-box:focus-within{ border-color:rgba(45,212,191,0.45); box-shadow:0 0 0 3px rgba(45,212,191,0.1); }
  .token-box .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .token-box .row1 span{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono'; }
  .token-box .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .amount-input{ background:transparent; border:none; color:var(--text); font-family:'JetBrains Mono'; font-size:23px; font-weight:500; width:100%; outline:none; }
  .amount-input::placeholder{ color:#454C5C; }
  .token-select{ display:flex; align-items:center; gap:7px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 6px; font-weight:600; font-size:14px; white-space:nowrap; flex-shrink:0; }
  .token-select .dot{ width:22px; height:22px; border-radius:50%; flex-shrink:0; }
  .token-select .dot.usdt{ background:linear-gradient(135deg,#26A17B,#1a7a5c); }
  .token-select .dot.znz{ background:linear-gradient(135deg, var(--teal), var(--violet)); }

  .swap-divider{ display:flex; justify-content:center; margin:-10px 0; position:relative; z-index:3; transform:translateZ(28px); }
  .swap-flip{ width:36px; height:36px; border-radius:11px; background:var(--surface); border:3px solid var(--surface); box-shadow:0 0 0 3px var(--surface), 0 6px 18px -6px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; color:var(--teal); font-size:15px; transition:transform 0.3s; }
  .swap-flip:hover{ transform:rotate(180deg); }

  .rate-line{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin:14px 0; font-family:'JetBrains Mono'; transform:translateZ(18px); }
  .rate-line b{ color:var(--text); font-weight:500; }

  .primary-btn{
    width:100%; padding:16px; border-radius:13px; font-weight:700; font-size:15px; text-align:center;
    transform:translateZ(24px); transition:opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .primary-btn.pending{ background:var(--surface-2); color:var(--gold); border:1px dashed rgba(240,185,11,0.4); }
  .primary-btn:hover{ box-shadow:0 14px 34px -14px rgba(240,185,11,0.35); }

  footer{ position:relative; z-index:2; text-align:center; padding:16px 0 22px; }
  footer p{ color:var(--muted); font-size:10.5px; font-family:'JetBrains Mono'; letter-spacing:0.03em; }

  @media (max-width:420px){
    .card{ padding:16px; border-radius:16px; }
    .amount-input{ font-size:20px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-glow"></div>

<nav>
  <div class="nav-inner">
    <div class="brand"><span class="mark"></span>ZirakSwap</div>
    <appkit-button balance="hide" label="Connect Wallet"></appkit-button>
  </div>
</nav>

<main>
  <div class="swap-wrap">
    <div class="pool-viz">
      <div class="pool-flow"></div>
      <div class="pool-orb a"><span>USDT</span></div>
      <div class="pool-orb b"><span>ZNZ</span></div>
    </div>

    <div class="card-stage" id="tiltStage">
      <div class="card">
        <div class="card-head"><h2>Swap</h2><div class="settings-icon">⚙</div></div>

        <div class="token-box">
          <div class="row1"><span>आप देंगे</span><span>Balance: 0.00</span></div>
          <div class="row2">
            <input type="text" class="amount-input mono" placeholder="0.0" inputmode="decimal">
            <div class="token-select"><span class="dot usdt"></span>USDT</div>
          </div>
        </div>

        <div class="swap-divider"><div class="swap-flip">⇅</div></div>

        <div class="token-box">
          <div class="row1"><span>आपको मिलेगा</span><span>Balance: 0.00</span></div>
          <div class="row2">
            <input type="text" class="amount-input mono" placeholder="0.0" inputmode="decimal" disabled>
            <div class="token-select"><span class="dot znz"></span>ZNZ</div>
          </div>
        </div>

        <div class="rate-line"><span>Rate</span><b>1 USDT = — ZNZ</b></div>
        <div class="rate-line"><span>Slippage</span><b>0.5%</b></div>

        <button class="primary-btn pending" id="swapBtn">Connect Wallet to Swap</button>
      </div>
    </div>
  </div>
</main>

<footer><p>ZIRAKSWAP · POWERED BY BLOCKCHAIN</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isMobile = window.innerWidth <= 640;

  /* ---- Reown AppKit wallet connect ---- */
  const swapBtn = document.getElementById('swapBtn');
  let walletAddress = null;
  let appKitModal = null;

  // AppKit ko module ke roop me CDN se load karte hain
  (async function initAppKit(){
    try{
      const { createAppKit, WagmiAdapter } = await import('https://cdn.jsdelivr.net/npm/@reown/appkit-cdn@latest/dist/appkit.js');

      const projectId = '30c89e55db814cfd1d197f018b46d049';

      // BNB Smart Chain network define kar rahe hain (PancakeSwap-style DEX ke liye)
      const bsc = {
        id: 56,
        name: 'BNB Smart Chain',
        nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
        rpcUrls: { default: { http: ['https://bsc-dataseed.binance.org'] } },
        blockExplorers: { default: { name: 'BscScan', url: 'https://bscscan.com' } }
      };

      const wagmiAdapter = new WagmiAdapter({
        networks: [bsc],
        projectId
      });

      appKitModal = createAppKit({
        adapters: [wagmiAdapter],
        networks: [bsc],
        projectId,
        metadata: {
          name: 'ZirakSwap',
          description: 'ZirakSwap Decentralized Exchange',
          url: 'http://88.222.245.113',
          icons: ['https://avatars.githubusercontent.com/u/179229932']
        },
        themeMode: 'dark',
        themeVariables: {
          '--w3m-accent': '#2DD4BF',
          '--w3m-border-radius-master': '2px'
        },
        features: { analytics: true, email: false, socials: [] }
      });

      // Wallet connect hone par address track karte hain
      appKitModal.subscribeAccount((account) => {
        if(account && account.isConnected && account.address){
          walletAddress = account.address;
          swapBtn.textContent = 'Smart Contract जल्द जुड़ेगा';
        }else{
          walletAddress = null;
          swapBtn.textContent = 'Connect Wallet to Swap';
        }
      });
    }catch(err){
      console.error('Reown AppKit load nahi hua:', err);
    }
  })();

  /* =========================================================
     ★★★ SMART CONTRACT INTEGRATION POINT ★★★
     Deploy होने के बाद यहाँ router/factory address + ABI डालें
     ========================================================= */
  const CONTRACT_ADDRESSES = {
    router:  "0x0000000000000000000000000000000000000000",
    factory: "0x0000000000000000000000000000000000000000"
  };
  const ROUTER_ABI = [ /* TODO: paste Router ABI here */ ];

  swapBtn.addEventListener('click', () => {
    if(!walletAddress){
      if(appKitModal) appKitModal.open();
      else alert('Wallet connect module अभी लोड हो रहा है, कुछ सेकंड बाद कोशिश करें।');
      return;
    }
    alert('Smart contract अभी जुड़ा नहीं है। Router address और ABI जोड़ने के बाद यहाँ से असली swap काम करेगा।');
    // TODO: ethers.js/web3.js से router.swapExactTokensForTokens() यहाँ कॉल होगा
  });

  /* ---- 3D tilt on swap card (desktop only) ---- */
  var stage = document.getElementById('tiltStage');
  if(stage && !reduced && !isMobile){
    stage.addEventListener('mousemove', function(e){
      var r = stage.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      stage.style.transform = 'rotateY(' + (x*10) + 'deg) rotateX(' + (-y*10) + 'deg)';
    });
    stage.addEventListener('mouseleave', function(){ stage.style.transform = 'rotateY(0deg) rotateX(0deg)'; });
  }

  /* ---- floating particle background (skip on mobile for performance) ---- */
  var canvas = document.getElementById('bg-canvas');
  if(canvas && window.THREE && !reduced && !isMobile){
    var w = window.innerWidth, h = window.innerHeight;
    var renderer = new THREE.WebGLRenderer({ canvas:canvas, alpha:true, antialias:true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
    camera.position.set(0, 0, 14);

    var group = new THREE.Group();
    scene.add(group);

    var geo = new THREE.BufferGeometry();
    var count = 90;
    var positions = new Float32Array(count*3);
    for(var i=0;i<count;i++){
      positions[i*3] = (Math.random()-0.5)*22;
      positions[i*3+1] = (Math.random()-0.5)*14;
      positions[i*3+2] = (Math.random()-0.5)*10 - 4;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    var mat = new THREE.PointsMaterial({ color:0x2DD4BF, size:0.045, transparent:true, opacity:0.55 });
    var points = new THREE.Points(geo, mat);
    group.add(points);

    var mat2 = new THREE.PointsMaterial({ color:0x8B5CF6, size:0.04, transparent:true, opacity:0.45 });
    var points2 = new THREE.Points(geo.clone(), mat2);
    points2.rotation.z = 0.6;
    group.add(points2);

    var mouseX=0, mouseY=0;
    window.addEventListener('mousemove', function(e){
      mouseX = (e.clientX/window.innerWidth)-0.5;
      mouseY = (e.clientY/window.innerHeight)-0.5;
    });

    function animate(){
      requestAnimationFrame(animate);
      group.rotation.y += 0.0006;
      group.rotation.x += (-mouseY*0.15 - group.rotation.x)*0.02;
      group.rotation.y += (mouseX*0.1 - group.rotation.y)*0.001;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function(){
      var nw = window.innerWidth, nh = window.innerHeight;
      camera.aspect = nw/nh; camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    });
  }
})();
</script>

</body>
</html>
